name: Shared dispatch queue regressions

on:
  pull_request:
    paths: ['workbench/**', 'tests/**', '.github/workflows/dispatch-integration.yml']
  push:
    branches: [main, codex/dispatch-cross-module-integration]
    paths: ['workbench/**', 'tests/**', '.github/workflows/dispatch-integration.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dispatch-integration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Isolated shared SQLite and full workbench regressions
        run: python -X utf8 -m unittest discover -v
      - name: Check patch whitespace
        run: git diff --check
