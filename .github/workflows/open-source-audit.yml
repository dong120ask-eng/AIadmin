name: Read-only release asset audit

on:
  push:
    branches: [main]
    paths: ['tools/audit_release_assets.py', '.github/workflows/open-source-audit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Inspect existing release ZIPs without executing contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/audit_release_assets.py
      - name: Retain redacted inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-audit
          path: audit-output/release-audit.json
          retention-days: 7
          if-no-files-found: error
