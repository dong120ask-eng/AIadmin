name: Ecommerce read-only pilot
on:
  push:
    branches: [main]
    paths:
      - 'workbench/**'
      - 'tests/**'
      - 'ecommerce-suite/示例与验收/ecom_tools.py'
      - 'ecommerce-suite/示例与验收/data_quality.py'
      - 'scripts/start-ecommerce.ps1'
      - 'scripts/verify-ecommerce.py'
      - 'scripts/package-ecommerce.py'
      - 'scripts/verify-ecommerce-package.py'
      - 'scripts/verify-ecommerce-windows.py'
      - '启动电商运营壳.cmd'
      - '.github/workflows/ecommerce-pilot.yml'
  pull_request:
    branches: [main]
    paths:
      - 'workbench/**'
      - 'tests/**'
      - 'ecommerce-suite/示例与验收/ecom_tools.py'
      - 'ecommerce-suite/示例与验收/data_quality.py'
      - 'scripts/start-ecommerce.ps1'
      - 'scripts/verify-ecommerce.py'
      - 'scripts/package-ecommerce.py'
      - 'scripts/verify-ecommerce-package.py'
      - 'scripts/verify-ecommerce-windows.py'
      - '启动电商运营壳.cmd'
      - '.github/workflows/ecommerce-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecommerce-pilot-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Workbench and pilot HTTP / parser / analysis tests
        run: python -m unittest discover -v
      - name: Independent CLI and HTTP smoke
        run: python scripts/verify-ecommerce.py --output build/ecommerce-pilot/http-evidence.json
      - name: Packaged source manifest, isolated tests and CLI HTTP smoke
        run: python scripts/verify-ecommerce-package.py --output build/ecommerce-pilot/package-evidence.json
      # The suite workflow owns all 36 calculation/gate regressions plus the
      # 14 installer/isolation/archive tests. Keep both workflows on shared-tool
      # changes: the pilot additionally verifies their HTTP integration.
      - name: Windows PowerShell 5.1 actual launcher lifecycle (synthetic only)
        if: runner.os == 'Windows'
        shell: powershell
        run: python scripts/verify-ecommerce-windows.py --shell powershell --output build/ecommerce-pilot/windows-ps51-evidence.json
      - name: Windows PowerShell 7 actual launcher lifecycle (synthetic only)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: python scripts/verify-ecommerce-windows.py --shell pwsh --output build/ecommerce-pilot/windows-ps7-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecommerce-pilot-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            build/ecommerce-pilot/*-evidence.json
            build/ecommerce-pilot/*-logs/**/*.log
          if-no-files-found: error
