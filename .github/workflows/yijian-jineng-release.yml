name: Build Yijian Jineng Release

on:
  push:
    branches: [main]
    paths: ['yijian-jineng/**', 'tools/audit_release_assets.py', 'tests/test_release_asset_audit.py', '.github/workflows/yijian-jineng-release.yml']
  pull_request:
    branches: [main]
    paths: ['yijian-jineng/**', 'tools/audit_release_assets.py', 'tests/test_release_asset_audit.py', '.github/workflows/yijian-jineng-release.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a new release after successful validation'
        type: boolean
        default: false
      audit_reference:
        description: 'Required for publication: reviewed materials audit record URL or repository path'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: yijian-jineng-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      asset: ${{ steps.metadata.outputs.asset }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Resolve release identity
        id: metadata
        run: python -X utf8 yijian-jineng/tools/release_metadata.py --output $env:GITHUB_OUTPUT

      - name: Build pinned portable runtime
        run: python -X utf8 yijian-jineng/tools/build_offline.py

      - name: Verify skills and run deployment regressions
        run: |
          $py = '.\yijian-jineng\offline\runtime\python.exe'
          & $py -X utf8 yijian-jineng/tools/check_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Skill validation failed' }
          & $py -X utf8 -m unittest discover -s yijian-jineng/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }

      - name: Package and verify deployment
        run: |
          $py = '.\yijian-jineng\offline\runtime\python.exe'
          New-Item -ItemType Directory -Path dist | Out-Null
          $asset = "dist/${{ steps.metadata.outputs.asset }}"
          & $py -X utf8 yijian-jineng/tools/package.py --output $asset
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
          & .\yijian-jineng\tools\setup.ps1 -TargetRoot "$env:RUNNER_TEMP\SelfMediaSmoke" -Plan
          if ($LASTEXITCODE -ne 0) { throw 'Deployment plan failed' }


      - name: Audit newly packaged ZIP before accepting build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s tests -p test_release_asset_audit.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Audit regression failed' }
          python tools/audit_release_assets.py --local "dist/${{ steps.metadata.outputs.asset }}"
          if ($LASTEXITCODE -ne 0) { throw 'New release ZIP audit failed' }

      - name: Retain redacted pre-publication audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-release-security-audit
          path: audit-output/local-release-audit.json
          retention-days: 30
          if-no-files-found: warn

      - name: Write and verify checksum
        env:
          ASSET_NAME: ${{ steps.metadata.outputs.asset }}
        run: |
          $asset = "dist/$env:ASSET_NAME"
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$pwd/dist/SHA256.txt", "$hash  $env:ASSET_NAME`n", [System.Text.UTF8Encoding]::new($false))
          python -X utf8 yijian-jineng/tools/release_metadata.py --verify dist
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata verification failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: yijian-jineng-validated
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: yijian-jineng-publish
      cancel-in-progress: false
    steps:
      - name: Require materials audit reference
        env:
          AUDIT_REFERENCE: ${{ inputs.audit_reference }}
        run: |
          if [[ -z "${AUDIT_REFERENCE//[[:space:]]/}" ]]; then
            echo "::error::Publication requires a reviewed materials audit record."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@v4
        with:
          name: yijian-jineng-validated
          path: dist

      - name: Verify downloaded release files
        run: python -X utf8 yijian-jineng/tools/release_metadata.py --verify dist

      - name: Check existing release and tag
        id: availability
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.notice('Release already exists; keeping all existing assets unchanged.');
              core.setOutput('create', 'false');
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.git.getRef({ owner, repo, ref: 'tags/' + tag });
              core.setFailed('Tag already exists without a release; investigate before publishing.');
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('create', 'true');

      - name: Create new release without overwriting assets
        if: steps.availability.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          ASSET_NAME: ${{ needs.build.outputs.asset }}
          AUDIT_REFERENCE: ${{ inputs.audit_reference }}
        run: |
          printf '%s\n' "Validated Windows portable skill bundle." "Materials audit: $AUDIT_REFERENCE" "Real-platform publishing acceptance remains pending." > RELEASE.md
          gh release create "$RELEASE_TAG" "dist/$ASSET_NAME" dist/SHA256.txt \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title "Yijian Jineng $RELEASE_TAG" --notes-file RELEASE.md
